name: Publish

on:
  push:
    branches:
      - main

concurrency:
  # ordinary pushes share one group so only the newest pending run survives;
  # release merges get their own group so a later push can never replace a pending release
  group: "${{ github.workflow }}-${{ contains(github.event.head_commit.message, 'chore: prepare release') && github.sha || github.ref_name }}"
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run package
      - name: Check committed dist is up to date
        # the release PR commits a fresh build, so a release commit must never ship a stale bundle
        if: "contains(github.event.head_commit.message, 'chore: prepare release')"
        run: git diff --exit-code -- dist
      - run: bun run test
  release:
    name: Create GitHub Release
    # only release when a knope prepare-release PR is merged
    if: "contains(github.event.head_commit.message, 'chore: prepare release')"
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
      - name: Create GitHub release
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
