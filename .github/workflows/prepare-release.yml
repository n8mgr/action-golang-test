on:
  push:
    branches: [main]
  workflow_dispatch: # manual runs prepare a beta pre-release

# pushes write `release` and dispatches write `release-beta`, so each only needs
# serializing against itself; sharing one group would let a push displace a
# pending beta request, since GitHub keeps only one pending run per group
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

name: Create Release PR
jobs:
  prepare-release:
    # skip stable release merges; beta merges fall through so the stable release PR is regenerated
    if: "!contains(github.event.head_commit.message, 'chore: prepare release') || contains(github.event.head_commit.message, '-beta.')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: main # releases are always prepared from main, whichever branch a dispatch selected
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
      - name: Prepare release
        run: knope prepare-release --verbose
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Prepare beta release
        run: knope prepare-beta --verbose
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
